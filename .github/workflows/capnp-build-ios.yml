name: Build Cap'n Proto for iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CAPNP_VERSION: 1.3.0
  IOS_DEPLOYMENT_TARGET: "13.0"

jobs:
  build:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: iphoneos
            arch: arm64
            label: device-arm64
          - sdk: iphonesimulator
            arch: arm64
            label: simulator-arm64
          - sdk: iphonesimulator
            arch: x86_64
            label: simulator-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cache Cap'n Proto source
        id: cache-capnp
        uses: actions/cache@v4
        with:
          path: capnp-source
          key: capnp-ios-${{ env.CAPNP_VERSION }}

      - name: Download Cap'n Proto
        if: steps.cache-capnp.outputs.cache-hit != 'true'
        run: |
          curl -L https://capnproto.org/capnproto-c++-${CAPNP_VERSION}.tar.gz -o capnp.tar.gz
          tar -xzf capnp.tar.gz
          mv capnproto-c++-${CAPNP_VERSION} capnp-source
          rm capnp.tar.gz

      - name: Patch source for iOS cross-compilation
        run: |
          cd capnp-source
          # On iOS, CMake auto-sets MACOSX_BUNDLE on executables, causing install() to
          # fail without BUNDLE DESTINATION. Fix by adding BUNDLE DESTINATION to all
          # install(TARGETS ...) calls in capnp, and disabling the bundle property.
          sed -i '' 's/set(CMAKE_MACOSX_BUNDLE TRUE)//g' CMakeLists.txt
          sed -i '' '1s/^/set(CMAKE_MACOSX_BUNDLE FALSE)\n/' CMakeLists.txt
          # Also patch any existing MACOSX_BUNDLE on add_executable
          sed -i '' 's/ MACOSX_BUNDLE//g' src/capnp/CMakeLists.txt

      - name: Configure & Build Cap'n Proto
        run: |
          SDK_PATH=$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)

          cd capnp-source
          mkdir -p build-${{ matrix.label }}
          cd build-${{ matrix.label }}

          cmake \
            -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=${SDK_PATH} \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${IOS_DEPLOYMENT_TARGET} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DCMAKE_C_COMPILER_WORKS=TRUE \
            -DCMAKE_CXX_COMPILER_WORKS=TRUE \
            ..

          cmake --build . --target capnp capnpc kj -- -j$(sysctl -n hw.logicalcpu)

      - name: Collect output
        run: |
          mkdir -p output/${{ matrix.label }}
          cp capnp-source/build-${{ matrix.label }}/src/capnp/libcapnp.a output/${{ matrix.label }}/
          cp capnp-source/build-${{ matrix.label }}/src/capnp/libcapnpc.a output/${{ matrix.label }}/
          cp capnp-source/build-${{ matrix.label }}/src/kj/libkj.a output/${{ matrix.label }}/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: capnp-ios-${{ matrix.label }}
          path: output/${{ matrix.label }}

  xcframework:
    runs-on: macos-latest
    needs: build

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create XCFrameworks
        run: |
          # Create fat simulator libraries (arm64 + x86_64)
          mkdir -p simulator-fat

          for lib in libcapnp.a libcapnpc.a libkj.a; do
            lipo -create \
              artifacts/capnp-ios-simulator-arm64/${lib} \
              artifacts/capnp-ios-simulator-x86_64/${lib} \
              -output simulator-fat/${lib}
          done

          # Create XCFramework for each library
          for lib in libcapnp.a libcapnpc.a libkj.a; do
            name="${lib%.a}"
            xcodebuild -create-xcframework \
              -library artifacts/capnp-ios-device-arm64/${lib} \
              -library simulator-fat/${lib} \
              -output ${name}.xcframework
          done

      - name: Zip XCFrameworks
        run: |
          zip -r capnp-ios-xcframeworks.zip \
            libcapnp.xcframework \
            libcapnpc.xcframework \
            libkj.xcframework

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: capnp-ios-xcframeworks
          path: capnp-ios-xcframeworks.zip
